name: Feature request
description: Suggest an idea for pvvx BLE Time Sync
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Before you open a new feature request, search the existing issues to see if someone already suggested it.
  - type: textarea
    attributes:
      label: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the solution you'd like
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe alternatives you've considered
  - type: textarea
    attributes:
      label: Additional context
      description: Device models, firmware versions, screenshots.
