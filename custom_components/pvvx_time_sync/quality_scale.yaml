rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No service actions; syncing is a button entity.
  appropriate-polling:
    status: done
    comment: No polling; syncs run every 24 h (RC clock) or 168 h (RTC) by default.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: Uses only bleak and bleak-retry-connector from the bluetooth integration.
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: No event subscriptions beyond Bluetooth presence, set up in the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >
      Connections through Bluetooth proxies are slow and often need retries, so
      adding a device never connects; pvvx firmware is verified on every sync
      and a repair issue reports devices without it.
  test-before-setup:
    status: exempt
    comment: >
      A battery device may be out of range at startup; syncs retry on their own
      and the Last sync sensor shows when one last succeeded.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow; settings are entities.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: The Bluetooth address is the identity; nothing to update.
  discovery:
    status: done
    comment: Default names of clock models; other pvvx models are added by hand.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is part of the core function.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: The only setting of an entry is its Bluetooth address.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One device per config entry; removing the entry removes it.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: No web requests.
  strict-typing: todo
