repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=300]
        exclude: ^uv\.lock$
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        # Runs in the project venv: type checking needs Home Assistant installed.
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
